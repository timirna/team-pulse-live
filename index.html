<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trust Survey Scorecard</title><link rel="stylesheet" href="survey.css?v=spark-2"></head><body>
<header><div><small>DEPARTMENT CONFIDENCE SNAPSHOT</small><h1>Trust Survey Scorecard</h1></div><button id="settings-open">Event setup</button><button id="access" aria-pressed="false">Reduce motion</button></header>
<main><section class="scene" aria-label="Survey chapel"><img src="assets/layers/00_bg.png" alt="Moonlit woodland"><div id="art"></div><div id="rose" class="result" aria-live="polite"></div><div id="door" class="result"><strong id="percentage"></strong><span>trust their team</span></div><div id="labels"></div></section>
<footer><div class="controls"><button id="play">Play reveal</button><button id="replay">Replay</button><button id="reset">Back to survey</button><button id="sound" aria-pressed="false">Sound on</button><button id="refresh">Refresh results</button></div><p id="status" role="status">Loading survey…</p></footer><section id="reference"><aside><h2>Take the survey</h2><div id="qr" role="link" tabindex="0" aria-label="Open the survey"></div><a id="survey-link" target="_blank" rel="noopener">Open survey</a></aside><section class="scores"><h2>Team confidence</h2><p>Average scores out of 5 · Q2–Q7 and Q9</p><div class="table-scroll"><table id="scores"></table></div></section></section></main>
<dialog id="settings"><form method="dialog"><h2>Event setup</h2><p>Connect a published survey endpoint, or load an exported CSV for this event.</p><label>Live results URL<input id="source-url" type="url" placeholder="https://…"></label><label>Survey form URL<input id="form-url" type="url" placeholder="https://…"></label><label>Or import survey responses<input id="csv-file" type="file" accept=".csv,text/csv"></label><p id="setup-status" role="status"></p><div class="controls"><button id="save-settings" type="button">Save connection</button><button id="default-settings" type="button">Restore default</button><button>Close</button></div></form></dialog>
<script src="js/vendor/qrcode.js"></script><script src="js/config.js"></script><script src="js/datasource.js"></script><script src="js/chapel-data.js"></script><script src="js/qrdisplay.js"></script><script src="js/colorutils.js"></script><script src="js/audio.js"></script><script src="glass.js?v=spark-2"></script><script src="survey.js?v=spark-2"></script></body></html>
