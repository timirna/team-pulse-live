<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Trust Survey Scorecard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=39-visual">
  <link rel="stylesheet" href="css/ui-ref.css?v=25-facets">
</head>
<body>
  <div class="app-shell">
    <div class="stage" id="stage">
      <div id="svg-mount"></div>
      <div id="vignette" aria-hidden="true"></div>
      <header class="scorecard-hero">
        <div class="scorecard-kicker">Department Confidence Snapshot</div>
        <h1 class="scorecard-title">Trust Survey Scorecard</h1>
      </header>
      <div id="overlay-wrap">
        <div id="door-result">
          <span id="door-result-value"></span>
          <span id="door-result-sr" class="hidden" aria-live="polite"></span>
        </div>
        <div id="rose-words-wrap"><div id="rose-words"></div></div>
        <div id="sunburst-rays" aria-hidden="true"></div>
        <div id="particle-container" aria-hidden="true"></div>
        <div id="grid-labels"></div>
      </div>
      <aside class="focus-panel" id="focus-panel"></aside>
      <div class="qr-stand" id="qr-stand">
        <div class="qr-stand-board">
          <div class="qr-stand-heading">Scan to<br>Take the Survey</div>
          <div id="qr-container" role="link" tabindex="0"></div>
        </div>
      </div>
      <div id="score-color-guide"></div>
      <div class="stage-controls">
        <div class="controls">
          <button id="btn-play">Play Reveal</button>
          <button id="btn-replay">Replay</button>
          <button id="btn-mute" aria-pressed="false">Sound on</button>
        </div>
        <div class="status-strip">
          <div id="status-line">Click “Play Reveal” to begin.</div>
        </div>
      </div>
      <div id="flash-overlay"></div>
    </div>
  </div>
  <script src="js/vendor/qrcode.js?v=1"></script>
  <script src="js/config.js?v=20260920-matchref"></script>
  <script src="js/ui-ref.js?v=23"></script>
  <script src="js/colorutils.js?v=4"></script>
  <script src="js/mockdata.js?v=4"></script>
  <script src="js/datasource.js?v=3"></script>
  <script src="js/dataprocessing.js?v=3"></script>
  <script src="js/painted-live-glass.js?v=2-facets"></script>
  <script src="js/svgloader.js?v=2"></script>
  <script src="js/panemapping.js?v=4"></script>
  <script src="js/audio.js?v=20260916-bgstartfix"></script>
  <script src="js/qrdisplay.js?v=1"></script>
  <script src="js/finaleeffects.js?v=3"></script>
  <script src="js/cinematiclighting.js?v=4"></script>
  <script src="js/animation.js?v=20260916-fixedword-resilient"></script>
  <script src="js/main.js?v=20260923-psdglass"></script>
</body>
</html>
